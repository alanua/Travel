<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Приватна сторінка подорожі</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:"#0f766e",accent:"#f59e0b",dark:"#17202a"},fontFamily:{sans:["Inter","system-ui","sans-serif"]}}}}</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{overflow-x:hidden}
    .hero-overlay{background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.18) 62%,rgba(0,0,0,.3))}
    .scroll-row{scrollbar-width:none}.scroll-row::-webkit-scrollbar{display:none}
    .photo-card{flex:0 0 min(82vw,320px)}.stay-card{flex:0 0 min(78vw,285px)}
    #route-map{height:320px;width:100%;max-width:100%;background:#e5e7eb}
    .leaflet-container{font-family:Inter,system-ui,sans-serif}
    .leaflet-tile-pane{filter:grayscale(.8) saturate(.45) contrast(.95)}
    .route-dot{width:18px;height:18px;border-radius:999px;background:#0f766e;border:4px solid #fff;box-shadow:0 2px 8px #0006}
    .route-label{background:#fff;border:1px solid #d1d5db;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:700;white-space:nowrap}
    @media(max-width:767px){#route-map{height:290px}}
  </style>
</head>
<body class="bg-gray-50 pb-24 text-gray-800 antialiased lg:pb-0">
  <div id="gate" class="grid min-h-screen place-items-center bg-white p-6">
    <div class="w-full max-w-md rounded-2xl border border-gray-200 p-8 shadow-sm">
      <div class="grid h-12 w-12 place-items-center rounded-xl bg-primary font-extrabold text-white">T</div>
      <h1 class="mt-5 text-2xl font-extrabold text-dark">Приватна сторінка подорожі</h1>
      <p id="gate-status" class="mt-2 text-gray-500">Відкриваю сімейний план…</p>
      <div class="mt-6 h-2 overflow-hidden rounded-full bg-gray-100"><div class="h-full w-2/5 animate-pulse rounded-full bg-primary"></div></div>
    </div>
  </div>
  <div id="app" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (()=>{"use strict";
    const revision="2026-07-26.3",payloadFile="payload.txt",nonce="WmJrtJPtYFKYXsH4",aad="travel:calendar-trips-2026:v1";
    const dec=s=>{s=s.replace(/\s/g,"").replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const safe=u=>{try{const x=new URL(u,location.href);return ["https:","http:"].includes(x.protocol)?x.href:"#"}catch{return"#"}};
    const photo=(url,alt="")=>`<img src="${esc(safe(url))}" alt="${esc(alt)}" class="h-full w-full object-cover" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
    function render(t){
      document.title=`${t.title} | Private Travel`;
      const uniquePhotos=[...new Set(t.photos.filter(Boolean))],galleryPhotos=uniquePhotos.filter(p=>p!==t.photos[0]).slice(0,6);
      const gallery=galleryPhotos.map(p=>`<div class="photo-card overflow-hidden rounded-2xl bg-white shadow-sm"><div class="aspect-[4/3]">${photo(p,"")}</div></div>`).join("");
      const gallerySection=gallery?`<section><div class="mb-5"><p class="text-xs font-bold uppercase tracking-[.16em] text-primary">Враження</p><h2 class="text-2xl font-extrabold text-dark">Атмосфера маршруту</h2></div><div class="-mx-4 flex snap-x snap-mandatory gap-4 overflow-x-auto px-4 pb-4 scroll-row lg:mx-0 lg:px-0">${gallery}</div></section>`:"";
      const days=t.days.map((d,i)=>{const image=d.image&&d.image!==t.photos[0]?`<div class="h-52 md:h-full">${photo(d.image,"")}</div>`:"";return `<article class="overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm${image?" md:grid md:grid-cols-[210px_1fr]":""}">${image}<div class="p-5 lg:p-6"><span class="text-xs font-bold uppercase tracking-wider text-primary">День ${i+1}</span><h3 class="mt-2 text-xl font-extrabold text-dark">${esc(d.title)}</h3><p class="mt-3 text-sm leading-relaxed text-gray-600">${esc(d.text)}</p><a class="mt-5 inline-flex text-sm font-bold text-primary hover:underline" target="_blank" rel="noopener noreferrer" href="${esc(safe(d.map))}">Відкрити маршрут дня ↗</a></div></article>`}).join("");
      const stays=t.stays.map(s=>`<article class="stay-card overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"><div class="p-4"><span class="text-xs font-bold uppercase text-primary">${esc(s.label)}</span><h3 class="mt-1 font-extrabold">${esc(s.title)}</h3><p class="mt-2 text-sm text-gray-500">${esc(s.text)}</p></div></article>`).join("");
      const checks=t.checks.map((x,i)=>`<details class="py-4"${i===0?" open":""}><summary class="cursor-pointer font-bold">${esc(x.title)}</summary><p class="pt-3 text-sm leading-relaxed text-gray-600">${esc(x.text)}</p></details>`).join("");
      document.getElementById("app").innerHTML=`
        <header class="fixed top-0 z-50 h-16 w-full border-b border-gray-100 bg-white/95 shadow-sm backdrop-blur"><div class="mx-auto flex h-full max-w-7xl items-center justify-between px-4"><a href="#top" class="text-xl font-extrabold tracking-tight text-dark">PRIVATE<span class="text-primary">TRAVEL</span></a><nav class="hidden gap-6 text-sm font-semibold md:flex"><a href="#route">Маршрут</a><a href="#days">Дні</a><a href="#stays">Житло</a></nav><span class="rounded-full bg-teal-50 px-3 py-1.5 text-xs font-bold text-primary">${esc(t.status)}</span></div></header>
        <section id="top" class="relative mt-16 flex min-h-[620px] h-[78vh] w-full flex-col justify-end bg-gray-900">${photo(t.photos[0],"")}<div class="hero-overlay absolute inset-0"></div><div class="absolute inset-x-0 bottom-0 z-10 mx-auto w-full max-w-7xl px-4 pb-10"><span class="inline-block rounded-md bg-accent px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-white">Приватний маршрут</span><h1 class="mt-4 max-w-5xl text-4xl font-extrabold leading-tight text-white lg:text-6xl">${esc(t.title)}</h1><p class="mt-4 max-w-3xl text-base leading-relaxed text-white/90 lg:text-lg">${esc(t.subtitle)}</p><div class="mt-6 flex flex-wrap gap-2 text-sm font-semibold text-white"><span class="rounded-md border border-white/30 bg-white/20 px-3 py-1.5">2 дорослих</span><span class="rounded-md border border-white/30 bg-white/20 px-3 py-1.5">${esc(t.date)}</span><span class="rounded-md border border-white/30 bg-white/20 px-3 py-1.5">Старт і фініш: Brandenburg</span></div></div></section>
        <main class="mx-auto max-w-7xl px-4 py-8 lg:grid lg:grid-cols-12 lg:gap-10 lg:py-12"><div class="min-w-0 space-y-12 lg:col-span-8">
          <section class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm lg:p-8"><div class="flex flex-wrap items-center gap-2 rounded-lg bg-gray-50 p-3 text-sm font-bold"><span class="text-primary">Brandenburg</span><span>→</span><span>${esc(t.route.join(" → "))}</span><span>→</span><span class="text-primary">Brandenburg</span></div><p class="mt-6 leading-relaxed text-gray-600">${esc(t.why)}</p></section>
          ${gallerySection}
          <section id="route"><div class="mb-5"><p class="text-xs font-bold uppercase tracking-[.16em] text-primary">Маршрут</p><h2 class="text-2xl font-extrabold text-dark">Міні-мапа поїздки</h2></div><div class="w-full max-w-full overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm"><div id="route-map"></div><div class="flex flex-col gap-3 border-t border-gray-100 p-4 sm:flex-row sm:items-center sm:justify-between"><strong class="text-sm">${esc(t.route.join(" → "))}</strong><a class="rounded-lg bg-primary px-4 py-2.5 text-center text-sm font-bold text-white" target="_blank" rel="noopener noreferrer" href="${esc(safe(t.map))}">Google Maps ↗</a></div></div></section>
          <section id="days"><div class="mb-6"><p class="text-xs font-bold uppercase tracking-[.16em] text-primary">День за днем</p><h2 class="text-2xl font-extrabold text-dark">Мініплан поїздки</h2></div><div class="space-y-5">${days}</div></section>
          <section id="stays"><div class="mb-5"><p class="text-xs font-bold uppercase tracking-[.16em] text-primary">Проживання</p><h2 class="text-2xl font-extrabold text-dark">Зони, які варто порівняти</h2></div><div class="-mx-4 flex gap-4 overflow-x-auto px-4 pb-4 scroll-row lg:mx-0 lg:px-0">${stays}</div></section>
          <section class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm lg:p-8"><h2 class="text-2xl font-extrabold text-dark">Що потрібно підтвердити</h2><div class="mt-5 divide-y divide-gray-100">${checks}</div></section>
        </div><aside class="mt-10 lg:col-span-4 lg:mt-0"><div class="sticky top-24 rounded-2xl border border-gray-100 bg-white p-6 shadow-lg"><p class="text-xs font-bold uppercase tracking-[.16em] text-primary">Поточний статус</p><h2 class="mt-2 text-2xl font-extrabold">${esc(t.status)}</h2><p class="mt-3 text-sm leading-relaxed text-gray-600">${esc(t.summary)}</p><div class="mt-6 rounded-xl bg-amber-50 p-4 text-sm text-amber-900">Нічого не заброньовано й не оплачено. Ціни та розклади перевіряються перед рішенням.</div><a href="#days" class="mt-5 block rounded-xl bg-accent px-5 py-3 text-center font-extrabold text-white">Дивитися план</a></div></aside></main>`;
      document.getElementById("gate").remove();document.getElementById("app").hidden=false;
      const map=L.map("route-map",{scrollWheelZoom:false}).setView(t.coords,6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
      const pts=t.points.map(x=>x.coords);L.polyline(pts,{color:"#0f766e",weight:4,dashArray:"8 7"}).addTo(map);
      t.points.forEach((x,i)=>L.marker(x.coords,{icon:L.divIcon({className:"",html:'<div class="route-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map).bindTooltip(`${i+1}. ${x.name}`,{permanent:true,direction:i%2?"right":"left",className:"route-label"}));
      if(pts.length>1)map.fitBounds(L.latLngBounds(pts).pad(.18));
    }
    async function boot(){try{
      const p=new URLSearchParams(location.hash.slice(1)),k=p.get("k"),trip=p.get("trip");if(!k||!trip)throw 0;
      const key=await crypto.subtle.importKey("raw",dec(k),"AES-GCM",false,["decrypt"]);
      const encoded=await fetch(payloadFile+"?rev="+revision,{cache:"no-store",referrerPolicy:"no-referrer"}).then(r=>r.ok?r.text():Promise.reject());
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(nonce),additionalData:new TextEncoder().encode(aad),tagLength:128},key,dec(encoded));
      const data=JSON.parse(new TextDecoder().decode(plain)),selected=data.trips.find(x=>x.id===trip);if(!selected)throw 0;
      history.replaceState(null,"","#k="+encodeURIComponent(k)+"&trip="+encodeURIComponent(trip));render(selected);
    }catch{document.getElementById("gate-status").textContent="Посилання неповне або недійсне."}}
    boot();
  })();
  </script>
</body>
</html>
