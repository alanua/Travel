<!doctype html>
<html lang="uk" data-travel-template="editorial-journey-v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Приватна сторінка подорожі</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:"#007f86",accent:"#f2cf00",ink:"#111111",paper:"#f7f6f2"},fontFamily:{sans:["Inter","system-ui","sans-serif"]}}}}</script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{overflow-x:hidden}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);grid-template-rows:1fr 1fr;gap:8px;height:min(64vw,620px);min-height:430px}
    .hero-grid .hero-main{grid-row:1/3}.hero-grid img{transition:transform .55s ease}.hero-grid figure:hover img{transform:scale(1.025)}
    .route-shell{width:100%;max-width:100%;overflow:hidden}.route-map{height:420px;width:100%;max-width:100%;background:#e5e7eb}
    .leaflet-container{font-family:Inter,system-ui,sans-serif}.leaflet-tile-pane{filter:grayscale(.72) saturate(.62) contrast(.95)}
    .route-dot{width:20px;height:20px;border-radius:999px;background:#007f86;border:4px solid #fff;box-shadow:0 2px 8px #0006}
    .route-label{background:#fff;border:1px solid #d1d5db;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px #0002}
    .scroll-row{scrollbar-width:none}.scroll-row::-webkit-scrollbar{display:none}
    .day-card{scroll-snap-align:start;flex:0 0 min(88vw,420px)}.stay-card{scroll-snap-align:start;flex:0 0 min(82vw,330px)}
    .section-rule{border-top:1px solid #d9d9d4}
    @media(max-width:767px){.hero-grid{grid-template-columns:1fr 1fr;grid-template-rows:minmax(255px,56vw) 150px;height:auto;min-height:0}.hero-grid .hero-main{grid-column:1/3;grid-row:1}.route-map{height:330px}.leaflet-tooltip.route-label{display:none}}
  </style>
</head>
<body class="bg-white pb-24 text-ink antialiased lg:pb-0">
  <div id="gate" class="grid min-h-screen place-items-center bg-white p-6">
    <div class="w-full max-w-md border border-black/10 bg-white p-8 shadow-sm">
      <div class="grid h-12 w-12 place-items-center bg-primary font-black text-white">T</div>
      <h1 class="mt-5 text-2xl font-black">Приватна сторінка подорожі</h1>
      <p id="gate-status" class="mt-2 text-gray-500">Відкриваю сімейний план…</p>
      <div class="mt-6 h-2 overflow-hidden bg-gray-100"><div class="h-full w-2/5 animate-pulse bg-primary"></div></div>
    </div>
  </div>
  <div id="app" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (()=>{"use strict";
    const revision="2026-08-03.1";
    const payloadFile="payload.txt";
    const nonce="j_1L-LzjBVl10T5_";
    const aad="travel:netherlands-amsterdam-utrecht-2026:v1";
    const dec=s=>{s=s.replace(/\s/g,"").replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const safe=u=>{try{const x=new URL(u,location.href);return ["https:","http:"].includes(x.protocol)?x.href:"#"}catch{return"#"}};
    const img=(url,alt="",classes="")=>`<img src="${esc(safe(url))}" alt="${esc(alt)}" class="h-full w-full object-cover ${classes}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
    const moneyRows=xs=>xs.map(x=>`<div class="flex items-start justify-between gap-6 border-t border-black/10 py-4"><span class="text-sm text-gray-600">${esc(x.label)}</span><strong class="shrink-0 text-right">${esc(x.value)}</strong></div>`).join("");
    function hero(d){
      const xs=d.hero_images||[];
      return `<div class="hero-grid"><figure class="hero-main overflow-hidden bg-gray-100">${img(xs[0],d.title,"!block")}</figure><figure class="overflow-hidden bg-gray-100">${img(xs[1]||xs[0],d.title,"!block")}</figure><figure class="overflow-hidden bg-gray-100">${img(xs[2]||xs[0],d.title,"!block")}</figure></div>`;
    }
    function render(d){
      document.title=`${d.title} | Private Travel`;
      const days=(d.days||[]).map((x,i)=>`<article class="day-card overflow-hidden border border-black/10 bg-white"><div class="aspect-[4/3] bg-gray-100">${img(x.image,x.title,"!block")}</div><div class="p-5"><span class="text-xs font-black uppercase tracking-[.16em] text-primary">${esc(x.date)}</span><h3 class="mt-2 text-xl font-black">${esc(x.title)}</h3><p class="mt-3 text-sm leading-relaxed text-gray-600">${esc(x.text)}</p><a class="mt-5 inline-flex border-b-2 border-accent pb-1 text-sm font-black" target="_blank" rel="noopener noreferrer" href="${esc(safe(x.map))}">Відкрити маршрут у Google Maps ↗</a></div></article>`).join("");
      const stays=(d.stays||[]).map(x=>`<article class="stay-card border border-black/10 bg-white p-5"><span class="text-xs font-black uppercase tracking-[.14em] text-primary">${esc(x.label)}</span><h3 class="mt-2 text-lg font-black">${esc(x.title)}</h3><p class="mt-2 text-2xl font-black">${esc(x.price)}</p><p class="mt-1 text-xs font-bold uppercase tracking-wider text-gray-500">${esc(x.evidence)}</p><p class="mt-4 text-sm leading-relaxed text-gray-600">${esc(x.text)}</p><a class="mt-5 inline-flex border-b-2 border-accent pb-1 text-sm font-black" target="_blank" rel="noopener noreferrer" href="${esc(safe(x.url))}">Перевірити на Booking.com ↗</a></article>`).join("");
      const highlights=(d.highlights||[]).map(x=>`<article class="border-t-4 border-accent bg-paper p-5"><h3 class="text-lg font-black">${esc(x.title)}</h3><p class="mt-2 text-sm leading-relaxed text-gray-600">${esc(x.text)}</p></article>`).join("");
      const alternatives=(d.transport.alternatives||[]).map(x=>`<div class="border-t border-black/10 py-4"><div class="flex items-center justify-between gap-4"><strong>${esc(x.mode)}</strong><span class="text-xs font-black uppercase tracking-wider text-gray-500">${esc(x.evidence)}</span></div><p class="mt-2 text-sm leading-relaxed text-gray-600">${esc(x.text)}</p></div>`).join("");
      const risks=(d.risks||[]).map((x,i)=>`<details class="border-t border-black/10 py-4"${i===0?" open":""}><summary class="cursor-pointer font-black">${esc(x.title)}</summary><p class="pt-3 text-sm leading-relaxed text-gray-600">${esc(x.text)}</p></details>`).join("");
      const sources=(d.sources||[]).map(x=>`<a class="block border-t border-black/10 py-3 text-sm font-bold hover:text-primary" target="_blank" rel="noopener noreferrer" href="${esc(safe(x.url))}">${esc(x.label)} ↗</a>`).join("");
      const routeLinks=(d.route_links||[]).map(x=>`<a class="inline-flex items-center justify-center border border-black px-4 py-3 text-sm font-black hover:bg-black hover:text-white" target="_blank" rel="noopener noreferrer" href="${esc(safe(x.url))}">${esc(x.label)} ↗</a>`).join("");
      document.getElementById("app").innerHTML=`
        <header class="sticky top-0 z-[1001] border-b border-black/10 bg-white/95 backdrop-blur">
          <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 md:px-8">
            <a href="#top" class="text-lg font-black">Travel</a>
            <nav class="hidden gap-6 text-sm font-bold md:flex"><a href="#route">Маршрут</a><a href="#days">Дні</a><a href="#budget">Бюджет</a></nav>
            <span class="bg-accent px-3 py-1 text-xs font-black uppercase tracking-wider">${esc(d.status)}</span>
          </div>
        </header>
        <main id="top">
          <section>${hero(d)}<div class="mx-auto max-w-7xl px-4 pb-10 pt-8 md:px-8 md:pb-14"><div class="max-w-4xl"><p class="text-xs font-black uppercase tracking-[.22em] text-primary">${esc(d.dates)} · ${esc(d.duration)}</p><h1 class="mt-3 text-4xl font-black leading-[.98] md:text-7xl">${esc(d.title)}</h1><p class="mt-5 max-w-3xl text-lg leading-relaxed text-gray-600 md:text-xl">${esc(d.subtitle)}</p><div class="mt-7 flex flex-wrap gap-2 text-sm font-bold"><span class="border border-black/15 px-3 py-2">${esc(d.travellers)}</span><span class="border border-black/15 px-3 py-2">База: ${esc(d.base)}</span><span class="border border-black/15 px-3 py-2">Оновлено ${esc(d.updated)}</span></div></div></div></section>
          <div class="mx-auto grid max-w-7xl gap-12 px-4 md:px-8 lg:grid-cols-[minmax(0,1fr)_340px]">
            <div class="min-w-0">
              <section class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Чому цей формат</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Амстердам без перевантаження</h2><p class="mt-5 max-w-3xl text-lg leading-relaxed text-gray-600">${esc(d.why)}</p><div class="mt-8 grid gap-4 md:grid-cols-3">${highlights}</div></section>
              <section id="route" class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Маршрут</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Амстердам → Утрехт</h2><div class="route-shell mt-7 border border-black/10"><div id="route-map" class="route-map"></div></div><div class="mt-5 flex flex-wrap gap-3">${routeLinks}</div></section>
              <section id="days" class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">День за днем</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Чотири дні без біганини</h2><div class="scroll-row mt-7 flex snap-x gap-4 overflow-x-auto pb-3">${days}</div></section>
              <section class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Як їхати</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Поїзд — основний варіант</h2><div class="mt-7 border border-black/10 p-6"><div class="flex flex-wrap items-start justify-between gap-4"><div><h3 class="text-xl font-black">${esc(d.transport.recommended.mode)}</h3><p class="mt-1 text-xs font-black uppercase tracking-wider text-gray-500">${esc(d.transport.recommended.evidence)}</p></div></div><p class="mt-4 leading-relaxed text-gray-600">${esc(d.transport.recommended.text)}</p><div class="mt-5 bg-paper p-4 text-sm font-bold">${esc(d.transport.recommended.decision_rule)}</div><div class="mt-5">${alternatives}</div></div></section>
              <section class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Проживання</p><h2 class="mt-2 text-3xl font-black md:text-4xl">База біля Amsterdam Amstel</h2><div class="scroll-row mt-7 flex snap-x gap-4 overflow-x-auto pb-3">${stays}</div><div class="mt-5 bg-paper p-5 text-sm leading-relaxed"><strong>Туристичний податок:</strong> ${esc(d.tax_note)}</div></section>
              <section id="budget" class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Повна вартість</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Реалістичний бюджет за двох</h2><div class="mt-7">${moneyRows(d.budget)}</div><div class="mt-2 flex items-center justify-between border-t-4 border-black py-5 text-xl font-black"><span>Разом</span><strong>${esc(d.total)}</strong></div><p class="mt-4 text-sm leading-relaxed text-gray-600">${esc(d.local_transport)}</p></section>
              <section class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Документи та ризики</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Перевірити перед купівлею</h2><div class="mt-7 border border-black/10 p-5"><h3 class="font-black">Документи</h3><p class="mt-3 text-sm leading-relaxed text-gray-600">${esc(d.documents)}</p></div><div class="mt-5">${risks}</div></section>
              <section class="section-rule py-10 md:py-14"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Джерела</p><h2 class="mt-2 text-3xl font-black md:text-4xl">Перевірка цін і правил</h2><div class="mt-5">${sources}</div></section>
            </div>
            <aside class="lg:pt-14"><div class="sticky top-24 border border-black bg-white p-6 shadow-[8px_8px_0_#f2cf00]"><p class="text-xs font-black uppercase tracking-[.2em] text-primary">Обраний кандидат</p><h2 class="mt-2 text-2xl font-black">${esc(d.dates)}</h2><p class="mt-2 text-sm text-gray-600">${esc(d.duration)} · ${esc(d.travellers)}</p><div class="mt-6 border-y border-black/10 py-5"><span class="block text-sm text-gray-500">Повна оцінка за двох</span><strong class="mt-1 block text-3xl font-black">${esc(d.total)}</strong></div><p class="mt-5 text-sm leading-relaxed text-gray-600">Нічого не заброньовано. Спочатку перевіряємо ICE і фінальну ціну номера, потім приймаємо рішення.</p><a href="#budget" class="mt-6 flex w-full items-center justify-center bg-black px-5 py-4 text-sm font-black text-white">Дивитися бюджет</a></div></aside>
          </div>
        </main>
        <div class="fixed inset-x-0 bottom-0 z-[1000] flex items-center justify-between border-t border-black bg-white p-3 lg:hidden"><div><small class="block text-gray-500">За двох</small><strong>${esc(d.total)}</strong></div><a href="#days" class="bg-black px-5 py-3 text-sm font-black text-white">Маршрут</a></div>`;
      drawMap(d.route_points||[]);
      document.getElementById("gate").hidden=true;
      document.getElementById("app").hidden=false;
    }
    function drawMap(points){
      const target=document.getElementById("route-map");
      if(!target||!points.length)return;
      const map=L.map(target,{scrollWheelZoom:false,zoomControl:true});
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
      const latlngs=points.map(p=>p.coords);
      if(latlngs.length>1)L.polyline(latlngs,{color:"#007f86",weight:4,opacity:.92}).addTo(map);
      points.forEach((p,i)=>L.marker(p.coords,{icon:L.divIcon({className:"",html:'<div class="route-dot"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map).bindTooltip(`${i+1}. ${esc(p.name)}`,{permanent:true,direction:i%2?"right":"left",className:"route-label"}));
      map.fitBounds(L.latLngBounds(latlngs).pad(.16));
      setTimeout(()=>map.invalidateSize(),120);
    }
    async function boot(){
      try{
        const params=new URLSearchParams(location.hash.slice(1));
        const k=params.get("k");
        if(!k)throw new Error("missing_key");
        const key=await crypto.subtle.importKey("raw",dec(k),"AES-GCM",false,["decrypt"]);
        const cipher=dec(await (await fetch(`${payloadFile}?v=${revision}`,{cache:"no-store"})).text());
        const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(nonce),additionalData:new TextEncoder().encode(aad)},key,cipher);
        render(JSON.parse(new TextDecoder().decode(plain)));
      }catch(e){
        document.getElementById("gate-status").textContent="Не вдалося відкрити сторінку. Використайте повне приватне посилання з календаря.";
      }
    }
    boot();
  })();
  </script>
</body>
</html>
